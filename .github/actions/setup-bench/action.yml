name: Set up acbench
description: Java, Python, the portablemc launcher and (optionally) Xvfb and Mesa for the headless clients.
inputs:
  clients:
    description: Install Xvfb, Mesa and the cached game installation, needed to start Minecraft clients.
    default: "true"
  launcher-key:
    description: Cache key of the game installation (work/launcher).
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "25"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet portablemc==5.0.6
    - if: inputs.clients == 'true'
      shell: bash
      # The runner image usually ships these already; apt-get update alone sometimes takes ~10 min on a runner,
      # so apt only runs for packages that are really missing.
      run: |
        missing=""
        for pkg in xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri libegl1 libegl-mesa0; do
          dpkg -s "$pkg" > /dev/null 2>&1 || missing="$missing $pkg"
        done
        if [ -z "$missing" ]; then
          echo "Xvfb and Mesa are already installed"
        else
          echo "Installing:$missing"
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q -o DPkg::Lock::Timeout=120
          sudo apt-get install -y -q --no-install-recommends -o DPkg::Lock::Timeout=120 $missing
        fi
    - if: inputs.clients == 'true' && inputs.launcher-key != ''
      uses: actions/cache/restore@v4
      with:
        path: work/launcher
        key: ${{ inputs.launcher-key }}
