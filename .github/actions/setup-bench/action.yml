name: Set up acbench
description: Java, Python, the portablemc launcher and (optionally) Xvfb and Mesa for the headless clients.
inputs:
  clients:
    description: Install Xvfb, Mesa and the cached game installation, needed to start Minecraft clients.
    default: "true"
  launcher-key:
    description: Cache key of the game installation (work/launcher).
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "25"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet portablemc==5.0.6
    - if: inputs.clients == 'true'
      shell: bash
      # Ubuntu mirrors sometimes stall for ~10 min on a single runner, so prepare downloads the missing packages
      # once into debs/ (cached and shipped in the bundle) and the shard jobs install them from there.
      run: |
        missing=""
        for pkg in xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri libegl1 libegl-mesa0; do
          dpkg -s "$pkg" > /dev/null 2>&1 || missing="$missing $pkg"
        done
        if [ -z "$missing" ]; then
          echo "Xvfb and Mesa are already installed"
          exit 0
        fi
        apt_opts=(-y -q --no-install-recommends -o DPkg::Lock::Timeout=120)
        if ls debs/*.deb > /dev/null 2>&1 && sudo apt-get install "${apt_opts[@]}" ./debs/*.deb; then
          echo "Installed$missing from debs/"
          exit 0
        fi
        echo "Downloading:$missing"
        # The runner's azure mirror stalled for 5-10 min in earlier runs before apt fell back to the main archive,
        # which then delivered within seconds; use the main archive directly.
        sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
          /etc/apt/sources.list.d/*.sources 2> /dev/null || true
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update -q -o DPkg::Lock::Timeout=120
        mkdir -p debs/partial
        sudo apt-get install "${apt_opts[@]}" --download-only -o Dir::Cache::archives="$PWD/debs" $missing
        sudo rm -rf debs/partial debs/lock
        sudo chown -R "$(id -u):$(id -g)" debs
        sudo apt-get install "${apt_opts[@]}" ./debs/*.deb
    - if: inputs.clients == 'true' && inputs.launcher-key != ''
      uses: actions/cache/restore@v4
      with:
        path: work/launcher
        key: ${{ inputs.launcher-key }}
