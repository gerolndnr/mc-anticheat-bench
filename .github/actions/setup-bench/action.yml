name: Set up acbench
description: Java, Python, the portablemc launcher and (optionally) Xvfb and Mesa for the headless clients.
inputs:
  clients:
    description: Install Xvfb, Mesa and the cached game installation, needed to start Minecraft clients.
    default: "true"
  launcher-key:
    description: Cache key of the game installation (work/launcher).
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "25"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet portablemc==5.0.6
    - if: inputs.clients == 'true'
      shell: bash
      # The runner's azure Ubuntu mirror sometimes stalls for 5-10 min on a single runner, so prepare downloads the
      # missing packages once into debs/ (cached per runner image, shipped in the bundle) and the shard jobs install
      # them with dpkg: apt would prefer the repository copy of the same version and download it again.
      run: |
        pkgs="xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri libegl1 libegl-mesa0"
        missing() { for pkg in $pkgs; do dpkg -s "$pkg" > /dev/null 2>&1 || printf ' %s' "$pkg"; done; }
        if [ -z "$(missing)" ]; then
          echo "Xvfb and Mesa are already installed"
          exit 0
        fi
        sudo rm -f /var/lib/man-db/auto-update
        if ls debs/*.deb > /dev/null 2>&1; then
          # Only packages this image lacks; an installed one may be newer and must not be downgraded.
          local_debs=()
          for deb in debs/*.deb; do
            dpkg -s "$(dpkg-deb -f "$deb" Package)" > /dev/null 2>&1 || local_debs+=("$deb")
          done
          echo "Installing from debs/: ${local_debs[*]}"
          [ ${#local_debs[@]} -eq 0 ] || sudo dpkg -i "${local_debs[@]}" || true
          if [ -z "$(missing)" ]; then
            exit 0
          fi
          echo "Still missing:$(missing), falling back to apt"
        fi
        # Fallback and prepare: download from the main archive, which delivered within seconds whenever azure stalled.
        grep -rl "mirror+file:/etc/apt/apt-mirrors.txt" /etc/apt/sources.list /etc/apt/sources.list.d 2> /dev/null \
          | xargs -r sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g'
        apt_opts=(-y -q --no-install-recommends -o DPkg::Lock::Timeout=120)
        sudo apt-get update -q -o DPkg::Lock::Timeout=120
        sudo apt-get install "${apt_opts[@]}" -f
        todo="$(missing)"
        mkdir -p debs/partial
        sudo apt-get install "${apt_opts[@]}" --download-only -o Dir::Cache::archives="$PWD/debs" $todo
        sudo rm -rf debs/partial debs/lock
        sudo chown -R "$(id -u):$(id -g)" debs
        # Same archive directory, so apt installs what it just downloaded instead of fetching it again.
        sudo apt-get install "${apt_opts[@]}" -o Dir::Cache::archives="$PWD/debs" $todo
    - if: inputs.clients == 'true' && inputs.launcher-key != ''
      uses: actions/cache/restore@v4
      with:
        path: work/launcher
        key: ${{ inputs.launcher-key }}
