id = "mlsac"
name = "MLSAC"
# Bukkit plugin name; the run is aborted if it is not enabled after server start.
plugin = "MLSAC"
target_bypass_permissions = ["mlsac.bypass"]

# MLSAC only checks combat (KillAura, aim assist, triggerbot, reach, hits through walls), so movement scenarios do not
# run against it.
categories = ["combat"]

# Its models run in the MLSAC cloud: the plugin sends combat feature windows there and gets verdicts back. It needs a
# licence key from mlsac.net (a free plan exists), taken from the MLSAC_API_KEY secret; without it MLSAC is skipped.
# Penalties (suppression, flag ladder, bans) are configured per account on mlsac.net, not in the plugin.
secret_env = ["MLSAC_API_KEY"]
# Cloud verdicts can change whenever the models are updated, so its pairs are measured every run.
reuse = false

known_issues = [
    "Verdicts come from the MLSAC cloud: results depend on the models deployed there at the time of the run and on the plan of the licence key.",
]

# Version 2.0.9 from its GitHub releases (Hangar only has 2.0.3). The API events used below exist since 2.0.8, and
# since 2.0.9 MLSAC reads Paper's "26.3.build.214-stable" as 26.3 instead of falling back to its 1.16.5 rules.
[download]
url = "https://github.com/SoMax1soft/mls-network-plugin/releases/download/2.0.9/MLSAC-2.0.9-java21.jar"
filename = "MLSAC-2.0.9-java21.jar"
sha256 = "26dce7167691548b1007aeed8d54c019f6c341ee4e3baf6fa5b5d47229ea2c34"

# ModelCheckEvent reports every verdict of the Pro and Mini models; only those with isFlagged() count.
[[flag_sources]]
type = "event"
plugin = "MLSAC"
class = "italy.mlsac.net.api.bukkit.ModelCheckEvent"
only_if = "isFlagged"
player = "getPlayerName"
check = "getModel"
vl = "getBuffer"

# The Ultra model reports flags through its own event.
[[flag_sources]]
type = "event"
plugin = "MLSAC"
class = "italy.mlsac.net.api.bukkit.UltraFlagEvent"
player = "getPlayerName"
check = "getClass.getSimpleName"

[files]
"plugins/MLSAC/config.yml" = "mlsac/config.yml"
