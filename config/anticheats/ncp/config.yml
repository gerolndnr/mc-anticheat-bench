# Benchmark profile for Updated-NoCheatPlus b279: every kick and tempkick command is replaced by the harmless console
# command "list", and the chat checks are off. NCP fills in all other settings with its defaults on start.
#
# The chat group only touches the benchmark's own control channel, no scenario: its relog check refuses logins less
# than 5 s after the last quit (the bot rejoins before every trial within ~0.5 s), and its command check limits the
# /acbench commands that mark trial boundaries to 3 per 18 ticks. With them on, the bot was locked out after two trials.
checks:
  chat:
    active: false
strings:
  kickagainst: list
  kickalive: list
  kickattackfrequency: list
  kickbow: list
  kickbspeed: list
  kickcaptcha: list
  kickchat1: list
  kickchat5: list
  kickchatfast: list
  kickchatnormal: list
  kickcommands: list
  kickcritical: list
  kickfastbreak: list
  kickfastclick: list
  kickfastconsume: list
  kickfastheal: list
  kickfastplace: list
  kickfly: list
  kickflyingfrequency: list
  kickfrequency: list
  kickgod: list
  kickillegalblockinteract: list
  kickillegalrotations: list
  kickimprobable: list
  kickinvaliddata: list
  kickpacketfrequency: list
  kickpackets: list
  kickscaffold: list
  kickselfhit: list
  kicksuspiciouscombat: list
  kickvehiclefly: list
  kickwb: list
  tempkick1: list
  tempkick5: list
