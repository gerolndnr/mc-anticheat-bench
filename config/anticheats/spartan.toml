id = "spartan"
name = "Spartan"
# Bukkit plugin name; the run is aborted if it is not enabled after server start.
plugin = "Spartan"
# The target bot only stands in as a target; the teleports pinning it drew speed-simulation flags. With spartan.bypass
# Spartan neither prevents nor reports a detection (CheckRunner.canCancel), checked on every violation.
target_bypass_permissions = ["spartan.bypass"]

# Problems of Spartan 4.0.9.0 itself on Minecraft 26.3, found by reading its source and the runs; the report lists them
# next to Spartan's numbers.
known_issues = [
    "Knockback is unknown to it: with ProtocolLib, Spartan takes velocity only from the entity-velocity packet and expects four integer fields there, which the packet no longer has since Minecraft 1.21.9, and it ignores the Bukkit velocity event in packet mode. Legal knockback is flagged by gravity-simulation (velocity baselines).",
    "Legal sprint-jumping is often flagged by speed-simulation on every jump (speed and timer baselines).",
    "ProtocolLib rejects its swing (ARM_ANIMATION) listener on 26.3, so swing-based combat checks receive no data.",
]

# Free edition from Modrinth (GPL-3). It detects as long as at most 5 players are online; a shard has 2.
[download]
modrinth = "spartan-anticheat"
loader = "paper"
file_regex = '^Spartan\.jar$'
version = "4.0.9.0"

# With ProtocolLib Spartan runs its packet-based checks. Without it (Bukkit events only) it flagged every legal jump
# on 26.3 (52-62 % false positives in a comparison run), so the benchmark uses packet mode.
# For 26.x only the rolling dev build works; it is cached and pinned per run like every other jar.
[[dependencies]]
url = "https://github.com/dmulloy2/ProtocolLib/releases/download/dev-build/ProtocolLib.jar"
filename = "ProtocolLib.jar"

# Spartan writes a detection to the console only once it prevents it, but fires its API event on every one
# (Important.enable_developer_api, on by default). The event carries no violation level.
[[flag_sources]]
type = "event"
plugin = "Spartan"
class = "ai.idealistic.spartan.api.PlayerViolationEvent"
player = "getPlayer.getName"
check = "getHackType"

# Punishments (by default a kick at the punishment level) are off for every check; detection, preventions and
# setbacks stay at their defaults.
[files]
"plugins/Spartan/checks.yml" = "spartan/checks.yml"

# No [[default_alerts]]: Spartan notifies once the time a check has accumulated (each violation adds a learned
# average, which decays in real time) passes 30 s, which cannot be replayed from the captured events.
